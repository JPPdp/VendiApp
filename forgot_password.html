<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Vendi</title>
    <link rel="icon" href="assets/images/VendiBLK2_NoBG.png" type="image/icon type">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="forgot_password.css">
</head>
<body>

<div class="CONTAINER">
    <div class="LEFT_SECTION">

        <header>
            <div class="LOGO">
                <div class="LOGO_NAME">Vendi.</div>
            </div>
        </header>

        <form id="FORGOT_PASSWORD_FORM" class="REGISTRATION_FORM active" method="post" action="#">
            <h2>FORGOT PASSWORD?</h2>
            <p>Enter the email address associated with your account. We will send you a link to reset your password.</p>

            <label for="EMAIL">Email Address</label>
            <input type="email" id="EMAIL" name="EMAIL" placeholder="Enter Email Address" required>

            <button type="submit">CONTINUE</button>
            <button type="button" onclick="window.location.href='login.html'">BACK TO LOGIN</button>
        </form>

    </div>

    <div class="RIGHT_SECTION">
    </div>
</div>

</body>
</html>
