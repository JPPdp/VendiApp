<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Vendi</title>
    <link rel="icon" href="assets/images/VendiBLK2_NoBG.png" type="image/icon type">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="CONTAINER">
    <!-- LEFT SECTION -->
    <div class="LEFT_SECTION">
        <div class="LOGO">
            <div class="LOGO_NAME">Vendi.</div>
            <a href="index.htm" class="BACK_TO_WEBSITE">
                Back to Website <i class="fas fa-arrow-right"></i>
            </a>
        </div>
        <div class="VECTOR_ART">
            <img src="assets/images/Calendar_Vector.png" alt="Vector_Art">
        </div>
        <p>Plan your perfect event with ease.</p>
    </div>

    <div class="RIGHT_SECTION">
        <!-- CLIENT REGISTRATION FORM -->
        <form id="CLIENT_FORM" class="REGISTRATION_FORM" method="post" action="index.htm">
            <h2>YOUR GATEWAY TO UNFORGETTABLE EVENTS</h2>
            <p>Ready to create an extraordinary experience? Sign up now and 
                let <span id="VENDI">Vendi</span> help you craft your ultimate event. </p>
        
        <div class="BESIDE_FIELDS">
            <div class="BESIDE_FIELD">
                <label for="CLIENT_FIRSTNAME">First Name</label>
                <input type="text" id="CLIENT_FIRSTNAME" name="FIRST_NAME" placeholder="Enter First Name" required>
            </div>
            <div class="BESIDE_FIELD">
                <label for="CLIENT_LASTNAME">Last Name</label>
                <input type="text" id="CLIENT_LASTNAME" name="LAST_NAME" placeholder="Enter Last Name" required>
            </div>
        </div>

            <label for="CLIENT_NUMBER">Mobile Number</label>
            <input type="tel" id="CLIENT_NUMBER" name="NUMBER" placeholder="Enter Mobile Number" maxlength="10" required pattern="[0-9]{10}">
        
            <label for="CLIENT_EMAIL">Email</label>
            <input type="email" id="CLIENT_EMAIL" name="EMAIL" placeholder="Enter Email Address" required>
        
            <div class="BESIDE_FIELDS">
                <div class="BESIDE_FIELD">
                    <div class="PASSWORD_CONTAINER">
                        <label for="PASSWORD">Password</label>
                        <input type="password" id="PASSWORD" name="PASSWORD" placeholder="Enter Password" required minlength="8">
                        <i class="fas fa-eye PASSWORD_TOGGLE" id="password-toggle"></i>
                    </div>
                </div>
            
                <div class="BESIDE_FIELD">
                    <div class="PASSWORD_CONTAINER">
                        <label for="CONFIRM_PASSWORD">Confirm Password</label>
                        <input type="password" id="CONFIRM_PASSWORD" name="CONFIRM_PASSWORD" placeholder="Re-enter Password" required minlength="8" maxlength="16">
                        <i class="fas fa-eye PASSWORD_TOGGLE" id="confirm-password-toggle"></i>
                    </div>
                </div>
            </div>


            <div class="TERMS">
                <label for="CLIENT_TERMS">By clicking, you agree to the 
                    <a href="termsandconditions.html">Terms and Conditions</a> and 
                    <a href="privacy_policy.html">Privacy Policy</a>.
                </label>
            </div>
        
            <button type="submit">CREATE ACCOUNT</button>
        
            <div class="LOGIN">Already have an account?</div>
            <div class="LOGIN_LINK">
                <a href="login.html">LOGIN</a>
            </div>
        </form>
    </div>
</div>

<script src='script.js'></script>
</body>
</html>
