        <!-- Listings Content -->
        <div class="DASHBOARD" id="DASHBOARD">
            <div class="UPPER">
                <div class="LEFT_UPPER">
                    <h1 class="BUSINESS_NAME">Listings</h1>
                </div>

                <div class="RIGHT_UPPER">
                    <div class="SEARCH_BAR">
                        <input type="text" placeholder="Search...">
                        <button type="submit"><i class="fas fa-search"></i></button>
                    </div>
                    <div class="ACCOUNT">
                        <div class="NOTIFICATION">
                            <i class="fas fa-bell"></i>
                            <span class="NOTIFICATION_DOT"></span> <!-- Red dot for notifications -->
                        </div>
                        <i class="fas fa-question-circle"></i> <!-- Help Icon -->

                        </a>                  
                    </div>

            <!-- Slot Management Form -->
            <div class="LISTING_FORM">
                <h2>Edit Slot</h2>
                <form id="SLOT_FORM">
                    <!-- Thumbnail -->
                    <div class="FORM_CARD">
                        <label for="THUMBNAIL">Thumbnail</label>
                        <div class="UPLOAD_CONTAINER">
                            <input type="file" id="THUMBNAIL" accept="image/*">
                            <div class="THUMBNAIL_PREVIEW" id="THUMBNAIL_PREVIEW">
                                <i class="fas fa-image"></i>
                                <span>Upload Thumbnail</span>
                            </div>
                        </div>
                    </div>

                    <!-- Preview Images -->
                    <div class="FORM_CARD">
                        <label for="PREVIEW">Preview Images (Max 5)</label>
                        <div class="UPLOAD_CONTAINER">
                            <input type="file" id="PREVIEW" accept="image/*" multiple>
                            <div class="PREVIEW_IMAGES" id="PREVIEW_IMAGES">
                                <i class="fas fa-images"></i>
                                <span>Upload Preview Images</span>
                            </div>
                        </div>
                    </div>

                    <!-- Location -->
                    <div class="FORM_CARD">
                        <label for="LOCATION">Location</label>
                        <input type="text" id="LOCATION" placeholder="Enter location" maxlength="100" required>
                    </div>

                    <!-- Description -->
                    <div class="FORM_CARD">
                        <label for="DESCRIPTION">Description (Max 200 characters)</label>
                        <textarea id="DESCRIPTION" placeholder="Enter description" maxlength="200" required></textarea>
                    </div>

                    <!-- Packages -->
                    <div class="FORM_CARD">
                        <label>Packages (Max 5)</label>
                        <div class="PACKAGES" id="PACKAGES">
                            <!-- Package inputs will be dynamically added here -->
                        </div>
                        <button type="button" class="ADD_PACKAGE" id="ADD_PACKAGE">
                            <i class="fas fa-plus"></i> Add Package
                        </button>
                    </div>

                    <!-- Save Changes Button -->
                    <div class="FORM_CARD">
                        <button type="submit" class="SAVE_CHANGES">
                            <i class="fas fa-save"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
