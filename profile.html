<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .profile-container {
            background-color: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }
        .profile-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 20px;
        }
        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .profile-name input {
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            border: none;
            border-bottom: 1px solid #ccc;
            outline: none;
        }
        .profile-password {
            display: none;
            margin-bottom: 20px;
        }
        .profile-buttons {
            display: flex;
            justify-content: space-between;
        }
        .profile-buttons button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .change-button {
            background-color: #4CAF50;
            color: white;
        }
        .delete-button {
            background-color: #f44336;
            color: white;
        }
        .save-button {
            background-color: #008CBA;
            color: white;
            display: none;
        }
        .profile-footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="profile-container">
        <img src="path/to/profile-image.jpg" alt="Profile Image" class="profile-image">
        <div class="profile-name">
            <span id="name-display">John Doe</span>
            <input type="text" id="name-input" value="John Doe" style="display: none;">
        </div>
        <div class="profile-password">Password: ********</div>
        <div class="profile-buttons">
            <button class="change-button" onclick="editName()">Change</button>
            <button class="delete-button">Delete</button>
            <button class="save-button" id="save-button" onclick="saveName()">Save</button>
        </div>
        <div class="profile-footer">User ID: 12345</div>
    </div>

    <script>
        function editName() {
            document.getElementById('name-display').style.display = 'none';
            document.getElementById('name-input').style.display = 'block';
            document.getElementById('save-button').style.display = 'inline-block';
        }

        function saveName() {
            var newName = document.getElementById('name-input').value;
            document.getElementById('name-display').textContent = newName;
            document.getElementById('name-display').style.display = 'block';
            document.getElementById('name-input').style.display = 'none';
            document.getElementById('save-button').style.display = 'none';
        }
    </script>
</body>
</html>
