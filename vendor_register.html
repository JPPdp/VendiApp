<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Vendor Registration | Vendi</title>
    <link rel="icon" href="assets/images/VendiBLK2_NoBG.png" type="image/icon type">
    <link rel="stylesheet" href="register.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="CONTAINER">
    <!-- LEFT SECTION -->
    <div class="LEFT_SECTION">
        <div class="LOGO">
            <div class="LOGO_NAME">Vendi.</div>
            <a href="index.htm" class="BACK_TO_WEBSITE">
                Back to Website <i class="fas fa-arrow-right"></i>
            </a>
        </div>
        <div class="VECTOR_ART">
            <img src="assets/images/Event_Vector.png" alt="Vector_Art">
        </div>
        <p>Collaborate with event organizers.</p>
    </div>

    <div class="RIGHT_SECTION">
    <!-- VENDOR REGISTRATION FORM -->
    <form id="VENDOR_FORM" class="REGISTRATION_FORM" method="post" action="dashboard.html">
        <h2>BECOME A FEATURED VENDOR</h2>
        <p> Ready to elevate your business? Sign up now to showcase your stalls
            and attract event planners who are ready to make their events extraordinary! </p>
    
        <div class="BESIDE_FIELDS">
            <div class="BESIDE_FIELD">
        <label for="BUSINESS_NAME">Business Name:</label>
        <input type="text" id="BUSINESS_NAME" name="BUSINESS_NAME" placeholder="Enter Business Name" required>
            </div>

            <div class="BESIDE_FIELD">
        <label for="BUSINESS_CATEGORY">Business Category:</label>
                <select id="BUSINESS_CATEGORY" name="BUSINESS_CATEGORY" required>
                    <option value="" disabled selected>What do you offer?</option>
                    <optgroup label="Food">
                        <option value="FAST_FOOD">Fast Food</option>
                        <option value="VEGAN">Vegan</option>
                        <option value="FAST_FOOD">International Cuisine</option>
                        <option value="DESSERTS_PASTRIES">Desserts & Pastries</option>
                    </optgroup>
                    <optgroup label="Beverages">
                        <option value="COFFEE_TEA">Coffee & Tea</option>
                        <option value="COCKTAILS">Cocktails</option>
                        <option value="NON_ALCOHOLIC">Non-Alcoholic Beverages</option>
                    </optgroup>
                    <optgroup label="Entertainment">
                        <option value="ARTS_CRAFTS">Arts & Crafts</option>
                        <option value="PHOTO_BOOTH">Photo Booth</option>
                        <option value="GAMES_ACTIVITIES">Games & Activities</option>
                    </optgroup>
                </select>
            </div>
    </div>

        <label for="BUSINESS_ADDRESS">Business Address:</label>
        <input type="text" id="BUSINESS_ADDRESS" name="BUSINESS_ADDRESS" placeholder="Enter Business Address" required>
    
        <label for="CONTACT_NAME">Primary Contact Name:</label>
        <input type="text" id="CONTACT_NAME" name="CONTACT_NAME" placeholder="Enter Contact Name">
    
        <label for="MOBILE_NUMBER">Mobile Number:</label>
        <input type="tel" id="MOBILE_NUMBER" name="MOBILE_NUMBER" placeholder="Enter Mobile Number" required pattern="[0-9]{10}" maxlength="10">
    
        <label for="EMAIL">Email Address:</label>
        <input type="email" id="EMAIL" name="EMAIL" placeholder="Enter Email Address" required>
    
        <div class="BESIDE_FIELDS">
            <div class="BESIDE_FIELD">
                <div class="PASSWORD_CONTAINER">
                    <label for="PASSWORD">Password</label>
                    <input type="password" id="PASSWORD" name="PASSWORD" placeholder="Enter Password" required minlength="8">
                    <i class="fas fa-eye PASSWORD_TOGGLE" id="password-toggle"></i>
                </div>
            </div>
        
            <div class="BESIDE_FIELD">
                <div class="PASSWORD_CONTAINER">
                    <label for="CONFIRM_PASSWORD">Confirm Password</label>
                    <input type="password" id="CONFIRM_PASSWORD" name="CONFIRM_PASSWORD" placeholder="Re-enter Password" required minlength="8" maxlength="16">
                    <i class="fas fa-eye PASSWORD_TOGGLE" id="confirm-password-toggle"></i>
                </div>
            </div>
        </div>

        
        <div class="TERMS">
            <label for="VENDOR_TERMS">By clicking, you agree to the 
                <a href="termsandconditions.html">Terms and Conditions</a> and 
                <a href="privacy_policy.html">Privacy Policy</a>.
            </label>
        </div>
    
        <button type="submit">SUBMIT</button>

        <div class="LOGIN">Already have an account?</div>
        <div class="LOGIN_LINK">
            <a href="login.html">LOGIN</a>
        </div>
        </form>
    </div>  
</div>

<script src='script.js'></script>
</body>
</html>
