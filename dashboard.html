<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Vendi</title>
        <link rel="icon" href="assets/images/VendiBLK2_NoBG.png" type="image/icon type">
        <link rel="stylesheet" href="dashboard.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

</head>
<body>

    <div class="CONTAINER">
        <!-- Navigation Bar -->
        <div class="NAVIGATION_BAR">
            <div class="LOGO">
                <div class="LOGO_ICON">
                    <img src="assets/images/VENDI_BG.png" alt="Logo">
                </div>
                <div class="LOGO_NAME">Vendi</div>
            </div>

            <div class="MENU_HEADER">MANAGEMENT</div>
                    <a href="#DASHBOARD"><i class="fa fa-fw fa-chart-bar"></i> Dashboard</a>
                    <a href="#"><i class="fa fa-fw fa-store"></i> Listings</a>
                    <a href="#"><i class="fa fa-fw fa-calendar"></i> Bookings</a>
                    <a href="#"><i class="fa fa-fw fa-envelope"></i> Messages</a>
                <div class="MENU_HEADER">PREFERENCES</div>
                    <a href="#"><i class="fa fa-fw fa-user"></i> Profile</a>
                    <a href="#"><i class="fa fa-fw fa-question-circle"></i> Help</a>
        </div>
        
        <!-- Dashboard Content -->
        <div class="DASHBOARD" id="DASHBOARD">
            <div class="UPPER">
                <div class="LEFT_UPPER">
                    <h1 class="USERNAME">Welcome, User</h1>
                </div>

                <div class="RIGHT_UPPER">
                    <div class="ACCOUNT">
                        <div class="PROFILE">
                            <img src="assets/images/jacks.jpg" alt="" class="PROFILE_PIC">
                            <div class="PROFILE_DROPDOWN">
                                <a href="#">Profile</a>
                                <a href="#">Log Out</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="CONTENT">
                <div class="BOX">
                    <h3>Pending</h3>
                    <p>2</p>
                </div>
                <div class="BOX">
                    <h3>Confirmed</h3>
                    <p>2</p>
                </div>
                <div class="BOX">
                    <h3>Completed</h3>
                    <p>40</p>
                </div>
            </div>

            <table class="BOOKING_TABLE">
                <thead>
                    <tr>
                        <th>Client Name</th>
                        <th>Booking Status</th>
                        <th>Event Venue</th>
                        <th>Selected Package</th>
                        <th>Event Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>John Doe</td>
                        <td>Pending</td>
                        <td>Student Plaza</td>
                        <td>Package 1</td>
                        <td id>2025-3-15</td>
                        <td>
                            <button>Approve</button>
                            <button>Reject</button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
</body>
</html>
